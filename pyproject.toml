[project]
name = "profile-craft"
version = "2.0.0"
description = "Resume builder with a validated SQLite data layer, batch ETL pipeline and SQL analytics."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
